# nginx server block for the validation Mini App (ALTERNATIVE to Caddy).
# Use this only if you prefer nginx + certbot over Caddy's automatic HTTPS.
#
# Install:
#   sudo cp deploy/nginx-miniapp.conf /etc/nginx/sites-available/miniapp.conf
#   # edit it and replace <SUBDOMAIN> with the real hostname
#   sudo ln -s /etc/nginx/sites-available/miniapp.conf /etc/nginx/sites-enabled/miniapp.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue + auto-configure TLS with certbot (rewrites this block to add the
# 443 server + redirect, and sets up renewal):
#   sudo certbot --nginx -d <SUBDOMAIN>
#
# Prereqs (owner-only): DNS A record for <SUBDOMAIN> -> public IP; inbound 80 AND 443 open.

server {
    listen 80;
    listen [::]:80;
    server_name <SUBDOMAIN>;

    # certbot adds the 443 server block + HTTP->HTTPS redirect when you run the
    # command above. Until then this serves plain HTTP for the ACME challenge.
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
